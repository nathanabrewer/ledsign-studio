<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Sign Studio</title>
<style>
  :root{
    --bg:#0a0c0f; --panel:#14181e; --panel2:#191e26; --line:#262c36; --line2:#323a46;
    --ink:#e7ebf1; --muted:#8a94a3; --faint:#5b6472;
    --amber:#ffb224; --ok:#37d67a; --warn:#ff6b5e;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  .app{display:grid; grid-template-rows:auto 1fr auto; height:100vh}

  /* ---------- top bar ---------- */
  .bar{
    display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-family:var(--mono); font-size:12px; letter-spacing:.26em;
    text-transform:uppercase; color:var(--muted); margin-right:4px}
  .brand b{color:var(--amber)}
  .grow{flex:1}
  .seg{display:flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden}
  .seg button{border:0; border-radius:0; border-right:1px solid var(--line2)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--amber); color:#0a0c0f; font-weight:700}
  button,select,input[type=file]::file-selector-button{
    font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line2); border-radius:8px; padding:8px 12px; cursor:pointer;
  }
  button:hover{background:#20262f}
  button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  button.primary{background:var(--amber); color:#0a0c0f; border-color:var(--amber); font-weight:700}
  button.primary:hover{filter:brightness(1.1)}
  .geom{font-family:var(--mono); font-size:12px; color:var(--faint)}

  /* ---------- main ---------- */
  main{display:grid; grid-template-columns:1fr 300px; gap:0; min-height:0}
  @media(max-width:900px){ main{grid-template-columns:1fr} }
  .stage{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:14px; min-width:0; overflow:auto;
  }
  .dropzone{width:100%; max-width:900px; position:relative}
  .dropzone.drag::after{
    content:"Drop image onto the panel"; position:absolute; inset:0; z-index:5;
    display:grid; place-items:center; border:2px dashed var(--amber); border-radius:14px;
    background:#ffb2241a; color:var(--amber); font-family:var(--mono); font-size:13px;
    letter-spacing:.1em; text-transform:uppercase; pointer-events:none;
  }
  .bezel{
    background:linear-gradient(180deg,#1c222b,#0f1319); border:1px solid var(--line2);
    border-radius:14px; padding:12px; box-shadow:0 24px 60px -30px #000;
  }
  .screenwrap{position:relative; width:100%; background:#000; border-radius:6px; overflow:hidden}
  canvas#screen{
    display:block; width:100%; height:auto; image-rendering:pixelated;
    cursor:grab; touch-action:none;
  }
  canvas#screen.dragging{cursor:grabbing}
  .screenwrap::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle at center, transparent 0 46%, #00000075 62%, #000000c4 100%);
    background-size:var(--cell-w) var(--cell-h); mix-blend-mode:multiply;
  }
  .hint{font-family:var(--mono); font-size:11px; color:var(--faint); text-align:center}

  /* ---------- side panel ---------- */
  aside{border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px}
  @media(max-width:900px){ aside{border-left:0; border-top:1px solid var(--line)} }
  .sec{margin-bottom:18px}
  .sec h2{
    font-family:var(--mono); font-size:10px; font-weight:600; color:var(--faint);
    letter-spacing:.24em; text-transform:uppercase; margin:0 0 8px;
  }
  .row{display:flex; gap:6px; align-items:center; margin-bottom:6px}
  .row label{font-size:12px; color:var(--muted); width:52px; flex:none}
  input[type=text],input[type=number],select{
    font-family:var(--mono); font-size:12px; background:#0e1218; color:var(--ink);
    border:1px solid var(--line2); border-radius:6px; padding:6px 8px; width:100%;
  }
  input[type=color]{
    width:34px; height:30px; padding:0; border:1px solid var(--line2);
    border-radius:6px; background:#0e1218; cursor:pointer; flex:none;
  }
  input[type=range]{width:100%; accent-color:var(--amber)}
  .layers{display:flex; flex-direction:column; gap:5px}
  .layer{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:12px;
  }
  .layer.sel{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber)}
  .layer .k{font-family:var(--mono); font-size:10px; color:var(--faint);
    text-transform:uppercase; letter-spacing:.1em}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer .x{color:var(--faint); padding:0 3px}
  .layer .x:hover{color:var(--warn)}
  .empty{font-size:12px; color:var(--faint); font-family:var(--mono); padding:6px 0}

  /* ---------- filmstrip ---------- */
  footer{border-top:1px solid var(--line); background:var(--panel); padding:10px 16px}
  .strip{display:flex; gap:8px; align-items:center; overflow-x:auto; padding-bottom:4px}
  .fr{
    position:relative; flex:none; border:1px solid var(--line); border-radius:7px;
    background:#000; cursor:pointer; width:112px; padding:0; overflow:hidden;
  }
  .fr.sel{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber)}
  .fr canvas{display:block; width:112px; height:32px; image-rendering:pixelated}
  .fr .n{
    position:absolute; inset:auto 0 0 0; font-family:var(--mono); font-size:9px;
    color:var(--muted); background:linear-gradient(0deg,#000000e0,transparent);
    display:flex; justify-content:space-between; padding:2px 4px;
  }
  .addfr{
    flex:none; width:112px; height:34px; border:1px dashed var(--line2); border-radius:7px;
    color:var(--faint); background:transparent; font-family:var(--mono); font-size:11px;
  }
  .addfr:hover{border-color:var(--amber); color:var(--amber)}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="brand">LED&nbsp;Sign&nbsp;<b>Studio</b></span>
    <div class="seg" id="sideSeg">
      <button data-side="A" class="on">Side A</button>
      <button data-side="B">Side B</button>
      <button data-side="AB">Both</button>
    </div>
    <button id="addImg">＋ Image</button>
    <button id="addTxt">＋ Text</button>
    <span class="grow"></span>
    <span class="geom" id="geom">112 × 32 · 24-bit RGB</span>
    <button id="importDsm">Import .dsm</button>
    <button id="exportBmp" class="primary">Export BMP</button>
    <button id="exportAll">Export all</button>
    <input type="file" id="fileImg" accept="image/*" hidden multiple>
    <input type="file" id="fileDsm" accept=".dsm" hidden>
  </div>

  <main>
    <div class="stage">
      <div class="dropzone" id="dropzone">
        <div class="bezel">
          <div class="screenwrap" id="screenwrap">
            <canvas id="screen" width="112" height="32"></canvas>
          </div>
        </div>
      </div>
      <p class="hint">Drag an image anywhere onto the panel · click a layer to select ·
        drag to move · arrow keys nudge 1px (shift = 8px)</p>
    </div>

    <aside>
      <div class="sec">
        <h2>Frame</h2>
        <div class="row"><label>Name</label><input type="text" id="frName"></div>
        <div class="row"><label>Dwell</label><input type="number" id="frDwell" min="0.5" step="0.5"></div>
        <div class="row"><label>BG</label><input type="color" id="frBg" value="#000000">
          <span class="geom" id="frBgHex">#000000</span></div>
      </div>

      <div class="sec">
        <h2>Layers</h2>
        <div class="layers" id="layers"></div>
      </div>

      <div class="sec" id="propsSec" hidden>
        <h2>Selected layer</h2>
        <div id="propsCommon">
          <div class="row"><label>X</label><input type="number" id="pX"></div>
          <div class="row"><label>Y</label><input type="number" id="pY"></div>
        </div>
        <div id="propsImg" hidden>
          <div class="row"><label>Scale</label><input type="range" id="pScale" min="5" max="400" value="100"></div>
          <div class="row"><label></label><span class="geom" id="pScaleV">100%</span></div>
          <div class="row"><label>Fit</label>
            <select id="pFit">
              <option value="none">none (native)</option>
              <option value="contain">contain</option>
              <option value="cover">cover</option>
              <option value="stretch">stretch</option>
            </select></div>
        </div>
        <div id="propsTxt" hidden>
          <div class="row"><label>Text</label><input type="text" id="pText"></div>
          <div class="row"><label>Size</label><input type="number" id="pSize" min="4" max="32"></div>
          <div class="row"><label>Color</label><input type="color" id="pColor" value="#ffb224"></div>
          <div class="row"><label>Font</label>
            <select id="pFont">
              <option value="Arial, Helvetica, sans-serif">Arial</option>
              <option value="Impact, sans-serif">Impact</option>
              <option value="'Courier New', monospace">Courier</option>
              <option value="Georgia, serif">Georgia</option>
            </select></div>
          <div class="row"><label>Bold</label><input type="checkbox" id="pBold"></div>
        </div>
      </div>
    </aside>
  </main>

  <footer>
    <div class="strip" id="strip"></div>
  </footer>
</div>

<script>
/* =======================================================================
   LED Sign Studio — pixel-exact editor for 24-bit RGB LED sign frames.

   The panel is a real <canvas> at native sign resolution (112x32 by default).
   Everything is composited at that size, so what you see is literally the
   pixels that will be encoded into the BMP — no scaling surprises.
   ======================================================================= */

const W = 112, H = 32;

/* ---------------- model ---------------- */
let sides = { A: [], B: [] };     // side -> array of frames
let curSide = 'A';
let curFrame = 0;
let selLayer = -1;

function newFrame(name){
  return { name: name || `frame-${Date.now()%100000}`, dwell: 3, bg:'#000000', layers: [] };
}
function frames(){ return sides[curSide === 'AB' ? 'A' : curSide]; }
function frame(){ return frames()[curFrame]; }
function layers(){ return frame() ? frame().layers : []; }

sides.A.push(newFrame('frame-1'));
sides.B.push(newFrame('frame-1'));

/* ---------------- rendering ---------------- */
const screen = document.getElementById('screen');
const ctx = screen.getContext('2d', { willReadFrequently:true });
ctx.imageSmoothingEnabled = false;

function drawFrameTo(c, f){
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = f ? f.bg : '#000';
  g.fillRect(0,0,W,H);
  if(!f) return;
  for(const L of f.layers){
    if(L.type === 'img' && L.img && L.img.complete){
      const w = Math.max(1, Math.round(L.img.naturalWidth  * L.scale));
      const h = Math.max(1, Math.round(L.img.naturalHeight * L.scale));
      g.drawImage(L.img, Math.round(L.x), Math.round(L.y), w, h);
    } else if(L.type === 'txt'){
      g.font = `${L.bold?'bold ':''}${L.size}px ${L.font}`;
      g.textBaseline = 'top';
      g.fillStyle = L.color;
      g.fillText(L.text, Math.round(L.x), Math.round(L.y));
    }
  }
}
function render(){
  drawFrameTo(screen, frame());
  renderStrip();
  syncPanel();
}

/* keep the LED dot mask aligned to the real pixel grid */
function sizeMask(){
  const wrap = document.getElementById('screenwrap');
  wrap.style.setProperty('--cell-w', (100/W)+'%');
  wrap.style.setProperty('--cell-h', (100/H)+'%');
}
sizeMask();

/* ---------------- filmstrip ---------------- */
function renderStrip(){
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  frames().forEach((f,i)=>{
    const b = document.createElement('button');
    b.className = 'fr' + (i===curFrame ? ' sel' : '');
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    drawFrameTo(c, f);
    const n = document.createElement('span');
    n.className='n';
    n.innerHTML = `<span>${i+1}</span><span>${f.dwell}s</span>`;
    b.append(c,n);
    b.onclick = ()=>{ curFrame=i; selLayer=-1; render(); };
    strip.appendChild(b);
  });
  const add = document.createElement('button');
  add.className='addfr'; add.textContent='+ frame';
  add.onclick = ()=>{ frames().push(newFrame(`frame-${frames().length+1}`));
                      curFrame=frames().length-1; selLayer=-1; render(); };
  strip.appendChild(add);
}

/* ---------------- side panel ---------------- */
function syncPanel(){
  const f = frame();
  if(f){
    document.getElementById('frName').value = f.name;
    document.getElementById('frDwell').value = f.dwell;
    document.getElementById('frBg').value = f.bg;
    document.getElementById('frBgHex').textContent = f.bg;
  }
  // layer list
  const box = document.getElementById('layers');
  box.innerHTML = '';
  if(!layers().length){
    box.innerHTML = '<p class="empty">No layers — drop an image or add text.</p>';
  }
  layers().forEach((L,i)=>{
    const d = document.createElement('div');
    d.className = 'layer' + (i===selLayer ? ' sel' : '');
    d.innerHTML = `<span class="k">${L.type}</span>
                   <span class="nm">${L.type==='txt' ? (L.text||'(empty)') : (L.name||'image')}</span>
                   <span class="x" title="delete">✕</span>`;
    d.onclick = e => {
      if(e.target.classList.contains('x')){ layers().splice(i,1); selLayer=-1; }
      else selLayer = i;
      render();
    };
    box.appendChild(d);
  });
  // properties
  const sec = document.getElementById('propsSec');
  const L = layers()[selLayer];
  sec.hidden = !L;
  if(!L) return;
  document.getElementById('pX').value = Math.round(L.x);
  document.getElementById('pY').value = Math.round(L.y);
  document.getElementById('propsImg').hidden = L.type !== 'img';
  document.getElementById('propsTxt').hidden = L.type !== 'txt';
  if(L.type === 'img'){
    document.getElementById('pScale').value = Math.round(L.scale*100);
    document.getElementById('pScaleV').textContent = Math.round(L.scale*100)+'%';
    document.getElementById('pFit').value = L.fit || 'none';
  } else {
    document.getElementById('pText').value = L.text;
    document.getElementById('pSize').value = L.size;
    document.getElementById('pColor').value = L.color;
    document.getElementById('pFont').value = L.font;
    document.getElementById('pBold').checked = !!L.bold;
  }
}

/* ---------------- layer creation ---------------- */
function addImageLayer(file){
  const img = new Image();
  img.onload = ()=>{
    // default: scale to fit inside the panel, centred
    const s = Math.min(W/img.naturalWidth, H/img.naturalHeight, 1);
    const L = { type:'img', img, name:file.name, scale:s, fit:'contain',
                x:(W - img.naturalWidth*s)/2, y:(H - img.naturalHeight*s)/2 };
    layers().push(L); selLayer = layers().length-1; render();
  };
  img.src = URL.createObjectURL(file);
}
function applyFit(L, mode){
  L.fit = mode;
  const iw = L.img.naturalWidth, ih = L.img.naturalHeight;
  if(mode === 'contain') L.scale = Math.min(W/iw, H/ih);
  else if(mode === 'cover') L.scale = Math.max(W/iw, H/ih);
  else if(mode === 'stretch') L.scale = W/iw;      // width-locked; height distorts via draw
  else L.scale = 1;
  L.x = (W - iw*L.scale)/2; L.y = (H - ih*L.scale)/2;
}

document.getElementById('addImg').onclick = ()=> document.getElementById('fileImg').click();
document.getElementById('fileImg').onchange = e => {
  [...e.target.files].forEach(addImageLayer); e.target.value='';
};
document.getElementById('addTxt').onclick = ()=>{
  layers().push({ type:'txt', text:'TEXT', size:14, color:'#ffb224',
                  font:'Arial, Helvetica, sans-serif', bold:true, x:4, y:8 });
  selLayer = layers().length-1; render();
};

/* ---------------- drag & drop ---------------- */
const dz = document.getElementById('dropzone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{
  e.preventDefault(); dz.classList.add('drag');
}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{
  e.preventDefault(); if(ev==='drop'||!dz.contains(e.relatedTarget)) dz.classList.remove('drag');
}));
dz.addEventListener('drop', e=>{
  [...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith('image/')).forEach(addImageLayer);
});

/* ---------------- move by dragging on the panel ---------------- */
let drag = null;
function panelPos(e){
  const r = screen.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
screen.addEventListener('pointerdown', e=>{
  const p = panelPos(e);
  // topmost layer whose box contains the point
  for(let i=layers().length-1;i>=0;i--){
    const L = layers()[i];
    let w,h;
    if(L.type==='img'){ w=L.img.naturalWidth*L.scale; h=L.img.naturalHeight*L.scale; }
    else { ctx.font=`${L.bold?'bold ':''}${L.size}px ${L.font}`;
           w=ctx.measureText(L.text).width; h=L.size; }
    if(p.x>=L.x && p.x<=L.x+w && p.y>=L.y && p.y<=L.y+h){
      selLayer=i; drag={ dx:p.x-L.x, dy:p.y-L.y };
      screen.setPointerCapture(e.pointerId); screen.classList.add('dragging');
      render(); return;
    }
  }
  selLayer=-1; render();
});
screen.addEventListener('pointermove', e=>{
  if(!drag) return;
  const p = panelPos(e), L = layers()[selLayer];
  if(!L) return;
  L.x = p.x - drag.dx; L.y = p.y - drag.dy;
  render();
});
['pointerup','pointercancel'].forEach(ev=>screen.addEventListener(ev, ()=>{
  drag=null; screen.classList.remove('dragging');
}));

/* arrow-key nudge */
addEventListener('keydown', e=>{
  if(selLayer<0 || /input|select|textarea/i.test(e.target.tagName)) return;
  const L = layers()[selLayer]; if(!L) return;
  const d = e.shiftKey ? 8 : 1;
  const map = { ArrowLeft:[-d,0], ArrowRight:[d,0], ArrowUp:[0,-d], ArrowDown:[0,d] };
  if(!map[e.key]) return;
  e.preventDefault();
  L.x += map[e.key][0]; L.y += map[e.key][1];
  render();
});

/* ---------------- property bindings ---------------- */
const bind = (id, fn, ev='input') =>
  document.getElementById(id).addEventListener(ev, e=>{ fn(e.target); render(); });

bind('frName',  t => frame().name = t.value);
bind('frDwell', t => frame().dwell = parseFloat(t.value)||3);
bind('frBg',    t => frame().bg = t.value);
bind('pX', t => { const L=layers()[selLayer]; if(L) L.x = parseFloat(t.value)||0; });
bind('pY', t => { const L=layers()[selLayer]; if(L) L.y = parseFloat(t.value)||0; });
bind('pScale', t => { const L=layers()[selLayer]; if(L){ L.scale = t.value/100; L.fit='none'; } });
bind('pFit', t => { const L=layers()[selLayer]; if(L && L.type==='img') applyFit(L, t.value); }, 'change');
bind('pText',  t => { const L=layers()[selLayer]; if(L) L.text = t.value; });
bind('pSize',  t => { const L=layers()[selLayer]; if(L) L.size = parseInt(t.value)||12; });
bind('pColor', t => { const L=layers()[selLayer]; if(L) L.color = t.value; });
bind('pFont',  t => { const L=layers()[selLayer]; if(L) L.font = t.value; }, 'change');
bind('pBold',  t => { const L=layers()[selLayer]; if(L) L.bold = t.checked; }, 'change');

/* ---------------- side switching ---------------- */
document.getElementById('sideSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  const next = b.dataset.side;
  if(next === 'AB'){
    // mirror A onto B so both sides show the same content
    sides.B = JSON.parse(JSON.stringify(sides.A.map(f=>({...f, layers:[]}))));
    sides.A.forEach((f,i)=>{ sides.B[i].layers = f.layers.slice(); });
  }
  curSide = next; curFrame = Math.min(curFrame, frames().length-1); selLayer=-1;
  render();
});

/* ---------------- BMP encoder (24-bit, uncompressed) ----------------
   Mirrors ledsign/bmp.py exactly: bottom-up rows, BGR channel order,
   rows padded to a 4-byte boundary.                                   */
function encodeBMP(canvas){
  const w = canvas.width, h = canvas.height;
  const px = canvas.getContext('2d').getImageData(0,0,w,h).data;
  const stride = Math.ceil(w*3/4)*4;
  const size = 54 + stride*h;
  const buf = new ArrayBuffer(size), dv = new DataView(buf), u8 = new Uint8Array(buf);
  u8[0]=0x42; u8[1]=0x4D;                  // "BM"
  dv.setUint32(2,  size, true);
  dv.setUint32(10, 54,   true);
  dv.setUint32(14, 40,   true);
  dv.setInt32 (18, w,    true);
  dv.setInt32 (22, h,    true);            // positive => bottom-up
  dv.setUint16(26, 1,    true);
  dv.setUint16(28, 24,   true);
  dv.setUint32(30, 0,    true);            // BI_RGB
  dv.setUint32(34, stride*h, true);
  for(let y=0;y<h;y++){
    const src = (h-1-y)*w*4;
    const dst = 54 + y*stride;
    for(let x=0;x<w;x++){
      u8[dst+x*3]   = px[src+x*4+2];       // B
      u8[dst+x*3+1] = px[src+x*4+1];       // G
      u8[dst+x*3+2] = px[src+x*4];         // R
    }
  }
  return new Blob([buf], {type:'image/bmp'});
}
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('exportBmp').onclick = ()=>{
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  drawFrameTo(c, frame());
  download(encodeBMP(c), `${frame().name}.bmp`);
};
document.getElementById('exportAll').onclick = ()=>{
  frames().forEach((f,i)=>{
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    drawFrameTo(c, f);
    setTimeout(()=>download(encodeBMP(c), `${f.name || 'frame-'+(i+1)}.bmp`), i*250);
  });
};

/* ---------------- .dsm import ----------------
   The authoring format: UTF-16LE, CRLF, "KEY value" with a 5-char key.
   Frames start at FNAME; TEXTA is 36 tab-separated fields.            */
document.getElementById('importDsm').onclick = ()=> document.getElementById('fileDsm').click();
document.getElementById('fileDsm').onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  const buf = await file.arrayBuffer();
  const text = new TextDecoder('utf-16le').decode(buf).replace(/^﻿/,'');
  const out = [];
  let cur = null;
  for(const line of text.split(/\r?\n/)){
    if(line.length < 5) continue;
    const key = line.slice(0,5), val = line.slice(6);
    if(key === 'FNAME'){ cur = newFrame(val); out.push(cur); continue; }
    if(!cur) continue;
    if(key === 'DURRA') cur.dwell = parseFloat(val)||3;
    else if(key === 'BACKG'){
      const [r,g,b] = val.split('\t').map(Number);
      cur.bg = '#' + [r,g,b].map(v=>(v|0).toString(16).padStart(2,'0')).join('');
    } else if(key === 'TEXTA'){
      const f = val.split('\t');
      const num = n => parseInt(f[n])||0;
      cur.layers.push({
        type:'txt', text:f[35]||'', size:num(2)||12,
        color:'#'+[num(4),num(5),num(6)].map(v=>v.toString(16).padStart(2,'0')).join(''),
        font:'Arial, Helvetica, sans-serif',
        bold:(f[12]||'')===(f[12]||'').toUpperCase() && !!f[12],
        x:num(0), y:num(1)
      });
    }
  }
  if(out.length){
    sides[curSide==='AB'?'A':curSide] = out;
    curFrame = 0; selLayer = -1; render();
  }
  e.target.value='';
};

render();
</script>
